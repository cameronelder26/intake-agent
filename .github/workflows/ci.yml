name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake-ci-only
          POSTGRES_DB: intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake -d intake"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway CI database. No API key is set anywhere: tests and the eval
      # smoke run use the mock extractor and answerer.
      INTAKE_PG_DSN: postgresql://intake:intake-ci-only@localhost:5432/intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,pg]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pgvector test runs against the service container)
        run: pytest -q
      - name: Eval harness, mock mode, pgvector store
        run: |
          python -m intake_agent.harness --mock --out "$RUNNER_TEMP/RESULTS.md" > /dev/null
          cat "$RUNNER_TEMP/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Eval, reviewer agent on and off (mock)
        run: |
          python evals/multiagent_eval.py --out "$RUNNER_TEMP/RESULTS-multiagent.md" > /dev/null
          cat "$RUNNER_TEMP/RESULTS-multiagent.md" >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intake-agent .
      - name: Smoke test
        run: |
          docker run --rm intake-agent rag ask --mock --policy-only \
            "Does Contoso Care require prior authorization for CPT 95806?"
      - name: API smoke test
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 --entrypoint uvicorn intake-agent \
            intake_agent.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -X POST http://127.0.0.1:8000/ask -H 'content-type: application/json' \
            -d '{"question": "Does Contoso Care require prior authorization for CPT 95806?", "policy_only": true}'
